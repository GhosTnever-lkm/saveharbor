name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Check package imports and CLI
        run: |
          python -m compileall -q saveharbor tests
          python -m saveharbor --version
