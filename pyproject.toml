[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saveharbor"
version = "1.1.1"
description = "Local-first, checksum-verified backup manager for PC game saves"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "GhosTnever" }]
keywords = ["game-saves", "backup", "restore", "save-manager", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Topic :: Games/Entertainment",
  "Topic :: System :: Archiving :: Backup",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
saveharbor = "saveharbor.__main__:main"

[tool.setuptools]
packages = ["saveharbor"]
